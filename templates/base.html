<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sistema de Análise de Vendas{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('inicio') }}"><span class="brand-mark">↗️</span><span>FLUXO<span class="brand-dot">.</span></span></a>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('vendas') }}">Dados de vendas</a>
      <a class="nav-admin" href="{{ url_for('admin') }}">Área administrativa <span>+</span></a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>FLUXO · Sistema de análise de vendas</footer>
</body>
</html>
